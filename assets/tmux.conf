set -g prefix None
unbind C-b
bind -n C-q detach-client
set -g status off
set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"
set -g focus-events on
# Forward the active pane title (Claude sets "✳ <title>") to the outer terminal tab.
set -g set-titles on
set -g set-titles-string "#{pane_title}"

# Ctrl+Z: runtimes are exec'd straight into the pane with no job-control shell,
# so the kernel discards SIGTSTP (orphaned process group). Claude then sits in its
# "run `fg`" state until someone sends SIGCONT; Codex smears a stale frame into
# scrollback. Remap: Claude panes (claude / <version> binaries) get ctrl+_ — the
# input-undo its suspend hint points at; Codex panes (node wrapper) swallow it;
# anything else (a real shell) keeps the raw key so job control still works.
bind -n C-z if -F '#{m/r:(^|/)(claude|[0-9][0-9.]*)$,#{pane_current_command}}' 'send-keys C-_' "if -F '#{m/r:(^|/)(node|codex)$,#{pane_current_command}}' '' 'send-keys C-z'"
