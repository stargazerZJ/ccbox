set -g prefix None
unbind C-b
bind -n C-q detach-client
set -g status off
set -g history-limit 50000
set -g mouse on
set -g default-terminal "tmux-256color"
set -g focus-events on
# Forward the active pane title (Claude sets "✳ <title>") to the outer terminal tab.
set -g set-titles on
set -g set-titles-string "#{pane_title}"
